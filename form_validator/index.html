<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <form id="registerForm" class="card" novalidate>
        <h1>Đăng ký tài khoản</h1>

        <label>
          Tên
          <input
            id="name"
            type="text"
            placeholder="Nhập tên"
            autocomplete="name"
          />
          <small class="message" id="nameMsg"></small>
        </label>

        <label>
          Email
          <input
            id="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
          />
          <small class="message" id="emailMsg"></small>
        </label>

        <label>
          Password
          <input id="password" type="password" placeholder="Nhập mật khẩu" />
        </label>
        <div class="meter">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <small class="message" id="passwordMsg"></small>

        <label>
          Confirm password
          <input
            id="confirmPassword"
            type="password"
            placeholder="Nhập lại mật khẩu"
          />
          <small class="message" id="confirmMsg"></small>
        </label>

        <label>
          Phone
          <input
            id="phone"
            type="tel"
            placeholder="0901-234-567"
            autocomplete="tel"
          />
          <small class="message" id="phoneMsg"></small>
        </label>

        <button id="submitBtn" type="submit" disabled>Submit</button>
      </form>
    </main>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content">
        <h2>Đăng ký thành công!</h2>
        <pre id="summary"></pre>
        <button id="closeModal" type="button">Đóng</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
